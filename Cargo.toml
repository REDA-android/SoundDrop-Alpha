[workspace]
members = [
    "crates/sounddrop_core",
    "crates/sounddrop_cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["REDA-android <SoundDrop Alpha>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/REDA-android/SoundDrop-Alpha"

[workspace.dependencies]
crc32fast = "1.4.2"
hound = "3.5.1"
thiserror = "2.0.11"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
clap = { version = "4.5.27", features = ["derive"] }
chacha20poly1305 = "0.10.1"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
blake3 = "1.6.1"
getrandom = "0.2.15"
